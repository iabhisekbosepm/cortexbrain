[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortexbrain"
version = "0.1.0"
description = "Auditable AI Knowledge System for Enterprise — extends Cognee OSS"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
authors = [
    { name = "CortexBrain Team" },
]

dependencies = [
    # === Foundation: Cognee OSS with required extras ===
    "cognee[neo4j,anthropic,redis]>=0.5.0",

    # === Additional data stores (CortexBrain-specific) ===
    # M_a (Active Memory) — Redis for activation scores & TTL
    "redis>=5.2.0",
    # M_r (Raw Memory) — Qdrant via Cognee, but we need direct client for activation queries
    "qdrant-client>=1.12.0",
    # M_meta (Meta Memory) — PostgreSQL for audit logs, analytics
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",

    # === MCP Server (Claude Code integration) ===
    "mcp>=1.2.0",
    "httpx>=0.28.0",

    # === Background jobs (decay cycle, batch ingestion) ===
    "celery[redis]>=5.4.0",

    # === Entity extraction (CortexBrain's GLiNER layer) ===
    "gliner>=0.2.0",

    # === Auth ===
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",

    # === Ingestion extras (code repos) ===
    "tree-sitter>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "fakeredis[lua]>=2.26.0",
]

[project.scripts]
cortexbrain = "cortexbrain.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cortexbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (requires Docker services)",
    "e2e: End-to-end API tests (requires full stack)",
]
addopts = "--strict-markers -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["cortexbrain"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
